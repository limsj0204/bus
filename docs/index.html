<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>도끼 클립 모음</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #16181d;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2563eb;
    --clip: #2563eb;
    --catch: #db2777;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #181b21;
      --text: #e8eaee;
      --muted: #9aa1ad;
      --line: #2a2e36;
      --accent: #60a5fa;
      --clip: #60a5fa;
      --catch: #f472b6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .updated { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .filters button {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .filters button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
  }
  .thumb { position: relative; aspect-ratio: 16 / 9; background: var(--line); }
  .card.CATCH .thumb { aspect-ratio: 16 / 9; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge {
    position: absolute; top: 8px; left: 8px;
    font-size: 0.72rem; font-weight: 700; color: #fff;
    padding: 2px 8px; border-radius: 6px;
  }
  .badge.CLIP { background: var(--clip); }
  .badge.CATCH { background: var(--catch); }
  .info { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
  .title { font-weight: 600; font-size: 0.95rem; line-height: 1.35; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 0.8rem; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>도끼 클립 모음</h1>
  <div class="updated" id="updated">불러오는 중…</div>
  <div class="filters" id="typeFilters"></div>
  <div class="filters" id="keywordFilters"></div>
  <div class="grid" id="grid"></div>
</main>
<script>
  const TYPE_LABEL = { ALL: "전체", CLIP: "클립", CATCH: "캐치" };
  const state = { type: "ALL", keyword: "ALL" };
  let data = { items: [], keywords: [] };

  function button(label, active, onClick) {
    const b = document.createElement("button");
    b.textContent = label;
    if (active) b.className = "on";
    b.onclick = onClick;
    return b;
  }

  function renderFilters() {
    const typeBox = document.getElementById("typeFilters");
    typeBox.replaceChildren(...["ALL", "CLIP", "CATCH"].map(t =>
      button(TYPE_LABEL[t], state.type === t, () => { state.type = t; render(); })));

    const kwBox = document.getElementById("keywordFilters");
    if (data.keywords.length > 1) {
      kwBox.replaceChildren(...["ALL", ...data.keywords].map(k =>
        button(k === "ALL" ? "모든 키워드" : "#" + k, state.keyword === k,
          () => { state.keyword = k; render(); })));
    } else {
      kwBox.replaceChildren();
    }
  }

  function formatDate(s) {
    if (!s) return "";
    return s.replace(/:\d\d$/, "");
  }

  function render() {
    renderFilters();
    const grid = document.getElementById("grid");
    const items = data.items.filter(it =>
      (state.type === "ALL" || it.type === state.type) &&
      (state.keyword === "ALL" || (it.keywords || []).includes(state.keyword)));

    if (!items.length) {
      grid.innerHTML = '<div class="empty">아직 모인 영상이 없어요.</div>';
      return;
    }
    grid.replaceChildren(...items.map(it => {
      const a = document.createElement("a");
      a.className = "card " + it.type;
      a.href = it.url;
      a.target = "_blank";
      a.rel = "noopener";

      const thumb = document.createElement("div");
      thumb.className = "thumb";
      if (it.thumbnail) {
        const img = document.createElement("img");
        img.src = it.thumbnail;
        img.loading = "lazy";
        img.alt = "";
        img.referrerPolicy = "no-referrer";
        img.onerror = () => img.remove();
        thumb.appendChild(img);
      }
      const badge = document.createElement("span");
      badge.className = "badge " + it.type;
      badge.textContent = TYPE_LABEL[it.type] || it.type;
      thumb.appendChild(badge);

      const info = document.createElement("div");
      info.className = "info";
      const title = document.createElement("div");
      title.className = "title";
      title.textContent = it.title;
      const meta = document.createElement("div");
      meta.className = "meta";
      const parts = [it.streamer_nick || it.streamer_id, formatDate(it.date)];
      if (it.views != null && it.views !== "") parts.push("조회 " + Number(it.views).toLocaleString("ko-KR"));
      meta.textContent = parts.filter(Boolean).join(" · ");
      info.append(title, meta);

      a.append(thumb, info);
      return a;
    }));
  }

  fetch("data.json?t=" + Date.now())
    .then(r => r.json())
    .then(json => {
      data = json;
      document.getElementById("updated").textContent =
        json.updated_at ? "마지막 업데이트: " + json.updated_at + " (30분마다 갱신)" : "아직 첫 업데이트 전이에요.";
      render();
    })
    .catch(() => {
      document.getElementById("updated").textContent = "목록을 불러오지 못했어요.";
    });
</script>
</body>
</html>

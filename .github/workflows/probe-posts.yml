name: 게시글 검색 확인 (임시)

on:
  push:
    branches:
      - ccr-91598e93-1wyp0d
    paths:
      - .github/probe/**
      - .github/workflows/probe-posts.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/probe/probe_posts.py

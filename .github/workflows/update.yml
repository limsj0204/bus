name: 클립 업데이트

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    paths:
      - config.yml
      - scripts/fetch.py
      - scripts/icons.py
      - scripts/posts.py
      - scripts/health.py
      - docs/**
      - .github/workflows/update.yml

permissions:
  contents: write
  # 사이트를 이 작업에서 직접 배포한다. (브랜치 자동 빌드의 '한 시간 10번' 한도를 피함)
  pages: write
  id-token: write
  deployments: read

concurrency:
  group: update-clips
  cancel-in-progress: false

jobs:
  update:
    # 작업용 브랜치에 올린 수정으로는 돌지 않게 한다. (디스코드 알림이 두 번 가는 것을 막음)
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pillow
      - name: 홈 화면 아이콘 (하루 한 번 프로필 사진 확인)
        run: python scripts/icons.py || true
      - run: python scripts/fetch.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: 게시글 확인
        # 게시글 쪽이 실패해도 클립 목록은 저장되게 한다.
        continue-on-error: true
        run: python scripts/posts.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: 상태 점검 (수집·배포가 멈추면 디스코드로 알림)
        continue-on-error: true
        run: python scripts/health.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
      - name: 변경 사항 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/icons
          if [ -f state/health.json ]; then git add state/health.json; fi
          if [ -f docs/posts.json ]; then git add docs/posts.json; fi
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "클립 목록 업데이트"
            # GitHub 쪽 일시적인 오류에 대비해 최대 3번까지 다시 시도한다.
            # 다른 실행과 겹쳐 같은 파일을 고쳤으면, 이번 실행이 새로 만든 파일을 쓴다. (-X theirs)
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
              git rebase --abort 2>/dev/null || true
              echo "저장 실패 (${attempt}번째), 잠시 뒤 다시 시도"
              sleep $((attempt * 5))
            done
            exit 1
          fi
      - name: 사이트 배포 방식 확인
        id: pages
        # Settings → Pages의 Source가 'GitHub Actions'이고, 배포할 필요가 있을 때만 아래 배포 단계를 실행한다.
        # 목록(data.json·posts.json)은 사이트가 저장소 원본에서 직접 읽으므로, 화면 파일이 바뀌었을 때만
        # 배포하고 예비용으로 한 시간에 한 번 배포한다. (GitHub Pages 대기열이 막혀도 영향을 덜 받음)
        run: |
          type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || echo none)
          if [ "$type" = "workflow" ]; then
            need=no
            for f in index.html sw.js manifest.webmanifest; do
              live=$(curl -fsSL "https://limsj0204.github.io/bus/${f}?t=$(date +%s)" 2>/dev/null | sha256sum | cut -c1-64)
              mine=$(sha256sum "docs/${f}" | cut -c1-64)
              if [ "$live" != "$mine" ]; then echo "${f} 바뀜 → 배포"; need=yes; fi
            done
            if [ "$(date -u +%M)" -lt 5 ]; then echo "정각 예비 배포"; need=yes; fi
            if [ "$need" = "yes" ]; then type=workflow; else type=skip; echo "배포할 것 없음"; fi
          fi
          echo "type=$type" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 멈춘 배포 정리
        # GitHub 쪽에서 '진행 중'으로 10분 넘게 멈춘 배포가 있으면 새 배포가 전부 거절되므로 취소한다.
        if: steps.pages.outputs.type == 'workflow'
        continue-on-error: true
        run: |
          cutoff=$(date -u -d '10 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=10" \
            --jq '.[] | "\(.id) \(.sha) \(.created_at)"' |
          while read -r id sha created; do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=1" --jq '.[0].state // "pending"')
            echo "배포 ${sha:0:7} ${created} ${state}"
            if [[ "$created" < "$cutoff" && ! "$state" =~ ^(success|inactive)$ ]]; then
              echo "멈춘 배포 취소: ${sha} (${created}, ${state})"
              gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/deployments/${sha}/cancel" || true
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.type == 'workflow'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.type == 'workflow'
        with:
          path: docs
      - name: 사이트 배포
        id: deployment
        if: steps.pages.outputs.type == 'workflow'
        # 평소 10초 안에 끝나지만 GitHub Pages 대기열이 밀리면 몇 분 걸린다. 배포가 드물어서 10분까지 기다린다.
        # 실패해도 실행 전체를 실패로 만들지 않는다. (다음 실행이 다시 배포함)
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000

name: 클립 업데이트

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    paths:
      - config.yml
      - scripts/fetch.py
      - scripts/icons.py
      - scripts/posts.py

permissions:
  contents: write

concurrency:
  group: update-clips
  cancel-in-progress: false

jobs:
  update:
    # 작업용 브랜치에 올린 수정으로는 돌지 않게 한다. (디스코드 알림이 두 번 가는 것을 막음)
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pillow
      - name: 홈 화면 아이콘 (하루 한 번 프로필 사진 확인)
        run: python scripts/icons.py || true
      - run: python scripts/fetch.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: 게시글 확인
        # 게시글 쪽이 실패해도 클립 목록은 저장되게 한다.
        continue-on-error: true
        run: python scripts/posts.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: 변경 사항 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/icons
          if [ -f docs/posts.json ]; then git add docs/posts.json; fi
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "클립 목록 업데이트"
            # GitHub 쪽 일시적인 오류에 대비해 최대 3번까지 다시 시도한다.
            for attempt in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
              echo "저장 실패 (${attempt}번째), 잠시 뒤 다시 시도"
              sleep $((attempt * 5))
            done
            exit 1
          fi

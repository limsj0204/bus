name: 클립 업데이트

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    paths:
      - config.yml
      - scripts/fetch.py
      - scripts/icons.py
      - scripts/posts.py
      - scripts/health.py
      - docs/**
      - .github/workflows/update.yml

permissions:
  contents: write
  # 사이트를 이 작업에서 직접 배포한다. (브랜치 자동 빌드의 '한 시간 10번' 한도를 피함)
  pages: write
  id-token: write
  deployments: read

concurrency:
  group: update-clips
  cancel-in-progress: false

jobs:
  update:
    # 작업용 브랜치에 올린 수정으로는 돌지 않게 한다. (디스코드 알림이 두 번 가는 것을 막음)
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pillow
      - name: 홈 화면 아이콘 (하루 한 번 프로필 사진 확인)
        run: python scripts/icons.py || true
      - run: python scripts/fetch.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: 게시글 확인
        # 게시글 쪽이 실패해도 클립 목록은 저장되게 한다.
        continue-on-error: true
        run: python scripts/posts.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: 상태 점검 (수집·배포가 멈추면 디스코드로 알림)
        continue-on-error: true
        run: python scripts/health.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
      - name: 변경 사항 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/icons
          if [ -f state/health.json ]; then git add state/health.json; fi
          if [ -f docs/posts.json ]; then git add docs/posts.json; fi
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "클립 목록 업데이트"
            # GitHub 쪽 일시적인 오류에 대비해 최대 3번까지 다시 시도한다.
            for attempt in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
              echo "저장 실패 (${attempt}번째), 잠시 뒤 다시 시도"
              sleep $((attempt * 5))
            done
            exit 1
          fi
      - name: 사이트 배포 방식 확인
        id: pages
        # Settings → Pages의 Source가 'GitHub Actions'일 때만 아래 배포 단계를 실행한다.
        run: echo "type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 멈춘 배포 정리
        # GitHub 쪽에서 '진행 중'으로 10분 넘게 멈춘 배포가 있으면 새 배포가 전부 거절되므로 취소한다.
        if: steps.pages.outputs.type == 'workflow'
        continue-on-error: true
        run: |
          cutoff=$(date -u -d '10 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=10" \
            --jq '.[] | "\(.id) \(.sha) \(.created_at)"' |
          while read -r id sha created; do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=1" --jq '.[0].state // "pending"')
            echo "배포 ${sha:0:7} ${created} ${state}"
            if [[ "$created" < "$cutoff" && ! "$state" =~ ^(success|inactive)$ ]]; then
              echo "멈춘 배포 취소: ${sha} (${created}, ${state})"
              gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/deployments/${sha}/cancel" || true
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.type == 'workflow'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.type == 'workflow'
        with:
          path: docs
      - name: 사이트 배포
        id: deployment
        if: steps.pages.outputs.type == 'workflow'
        # 평소 10초 안에 끝난다. GitHub Pages 쪽이 멈추면 오래 붙잡지 않고, 실행 전체를
        # 실패로 만들지도 않는다. (수집 결과는 이미 저장돼 있어서 다음 실행 때 다시 배포됨)
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 180000

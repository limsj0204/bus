# 이 파일만 고치면 다음 실행부터 반영돼요.

# 제목에 이 단어가 하나라도 들어간 영상만 모아요. 여러 개 써도 돼요.
keywords:
  - 도끼

# 제목에 이 단어가 들어가면 빼요. (예: - 도끼질)
exclude_words: []

# 이 방송국(스트리머 ID)에서 나온 영상은 빼요.
exclude_streamers:
  - yangdoki

# 찾을 영상 종류: CLIP(클립), CATCH(캐치). 다시보기는 넣지 않아요.
types:
  - CLIP
  - CATCH

# 처음 수집할 때(또는 이 숫자를 늘렸을 때) 최근 며칠치를 채울지.
# 이미 모은 예전 영상은 기간이 지나도 지우지 않아요.
backfill_days: 7

# 사이트에 보관할 최대 영상 수 (넘으면 가장 오래된 것부터 지워요)
max_items: 2000

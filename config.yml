# 이 파일만 고치면 다음 실행부터 반영돼요.

# 제목에 이 단어가 하나라도 들어간 영상만 모아요. 여러 개 써도 돼요.
keywords:
  - 도끼

# 제목에 이 단어가 들어가면 빼요. (예: - 도끼질)
exclude_words: []

# 이 방송국(스트리머 ID)에서 나온 영상은 빼요.
exclude_streamers:
  - yangdoki

# 제목을 고치지 않고 딴 클립(제목이 원본 방제와 똑같은 영상)은 빼요. false로 바꾸면 보여요.
exclude_unedited: true

# 찾을 영상 종류: CLIP(클립), CATCH(캐치). 다시보기는 넣지 않아요.
types:
  - CLIP
  - CATCH

# 처음 수집할 때(또는 이 숫자를 늘렸을 때) 최근 며칠치를 채울지.
# 이미 모은 예전 영상은 기간이 지나도 지우지 않아요.
backfill_days: 7

# 0시부터 이 시간마다(3이면 0·3·6…21시) 최근 rescan_days일치를 다시 훑어서,
# 나중에 제목을 고쳐 키워드가 들어간 영상도 잡아요.
rescan_hours: 3
rescan_days: 7

# 사이트에 보관할 최대 영상 수 (넘으면 가장 오래된 것부터 지워요)
max_items: 2000

# 디스코드 알림 (웹후크 주소는 GitHub 저장소 Settings → Secrets에 DISCORD_WEBHOOK_URL로 넣어요)
discord:
  enabled: true
  # 알릴 영상 종류
  types:
    - CLIP
    - CATCH
  # 특정 원본 방송만 알리고 싶으면 스트리머 이름이나 ID를 적어요. 비워 두면 전부 알려요.
  only_origins: []
  # 수집이나 사이트 배포가 이 시간(분) 넘게 멈추면 알려요. 끄려면 health_alerts: false
  health_alerts: true
  health_minutes: 30

# 이 작성자가 새로 쓴 게시글을 모아요. (SOOP 통합검색 → 게시글 → 검색 범위: 닉네임)
# 처음 실행한 때부터 올라오는 글만 모으고, 그 전 글은 넣지 않아요.
posts:
  enabled: true
  # 작성자 닉네임. 여러 명 써도 돼요.
  authors:
    - 양도끼
  # 닉네임이 같은 다른 사람을 거르려고 아이디도 확인해요. 비워 두면 닉네임만 봐요.
  author_ids:
    - yangdoki
  # 이 숫자를 늘리면 다음 실행 때 한 번만 최근 몇 시간치 글을 채워요. (예: 12면 최근 12시간)
  # 이미 채운 뒤에는 그대로 둬도 다시 채우지 않아요.
  backfill_hours: 12
  # 새 글을 디스코드로 알릴지
  discord: true
  # 사이트에 보관할 최대 글 수
  max_items: 500
